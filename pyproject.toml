[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobiquant"
version = "0.1.0"
description = "Mixed-bit routed quantization and calibration for LLaMA models."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch==2.8.0", "transformers==4.56.1", "accelerate==1.10.1",
    "datasets==4.0.0", "numpy==2.2.6", "tqdm==4.67.3",
    "sentencepiece==0.2.1", "tokenizers==0.22.0", "protobuf==6.32.0",
    "termcolor==3.1.0", "huggingface-hub==0.34.4", "hf-xet==1.3.1",
    "safetensors==0.7.0",
]

[tool.setuptools]
py-modules = ["datautils", "main_bitmoe", "parser", "utils"]

[tool.setuptools.packages.find]
include = ["models*", "quantize*", "workflows*"]

[tool.setuptools.package-data]
workflows = ["training_recipes.json"]
